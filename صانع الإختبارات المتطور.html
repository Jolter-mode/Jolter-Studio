    /* ================= التنسيقات العامة والملء الكامل للشاشة ================= */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'Cairo', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); transition: background-color 0.4s ease, color 0.4s ease; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; width: 100vw; }

    #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
    
    #bgVideoContainer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; overflow: hidden; display: none;
    }
    #bgVideoContainer video {
      width: 100vw; height: 100vh; object-fit: cover; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }

    header {
      position: relative; z-index: 10; background: var(--panel); border-bottom: 2px solid var(--border);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%;
    }
    .brand { font-size: 1.4rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }

    .brand { position: relative; isolation: isolate; }
    .brand::after { content: ""; position: absolute; inset: -10px -18px; border-radius: 999px; background: radial-gradient(circle at 32% 50%, rgba(232,189,77,.15), transparent 56%); filter: blur(10px); z-index: -1; pointer-events: none; }
    .brand-icon { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015)); border: 1px solid rgba(236,204,111,.24); box-shadow: 0 0 22px rgba(226,182,62,.14), inset 0 0 16px rgba(255,242,180,.045); overflow: hidden; position: relative; }
    .brand-icon::before { content: ""; position: absolute; inset: 5px; border-radius: 11px; border: 1px solid rgba(255,235,139,.08); pointer-events: none; }
    .brand-icon svg { width: 100%; height: 100%; display: block; transition: transform .35s ease, filter .35s ease; }
    .brand:hover .brand-icon svg { transform: scale(1.045) rotate(-1deg); filter: drop-shadow(0 0 9px rgba(242,201,80,.32)); }
    .brand-name { display: flex; flex-direction: column; gap: 1px; line-height: 1.08; }
    .brand-name strong { font-size: 1.05rem; letter-spacing: .1px; }
    .brand-name span { font-size: .66rem; color: color-mix(in srgb, var(--text) 62%, transparent); font-weight: 700; letter-spacing: 1.2px; opacity: .78; }
    @media (max-width: 560px) {
      .brand-icon { width: 40px; height: 40px; flex-basis: 40px; border-radius: 12px; }
      .brand-name strong { font-size: .98rem; }
      .brand-name span { font-size: .58rem; letter-spacing: .8px; }
    }
    @supports not (color: color-mix(in srgb, white, black)) {
      .brand-name span { color: rgba(255,255,255,.62); }
    }
    
    .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
main { position: relative; z-index: 10; flex: 1; padding: 15px; width: 100%; max-width: 100%; margin: 0; }

    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 100%;
    }

    /* الأزرار والمدخلات */
    .btn {
      background: var(--accent); color: #fff; border: 1px solid var(--border); padding: 8px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; user-select: none;
    }
    body[data-theme="light-stark"] .btn { color: #000; }
    .btn:active { transform: scale(0.96); }
    .btn-danger { background: #ef4444 !important; color: #fff !important; }
    .btn-success { background: #10b981 !important; color: #fff !important; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); outline: none; margin-bottom: 12px; font-size: 1rem;
    }

    .exam-timer-bar {
      position: sticky; top: 10px; z-index: 100; background: var(--panel); padding: 10px 20px;
      border-radius: 30px; border: 2px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 15px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); width: 100%;
    }
    .timer-badge { font-family: monospace; font-size: 1.3rem; padding: 2px 10px; border-radius: 12px; transition: color 0.3s ease; }
    .timer-green { color: #22c55e; }
    .timer-black { color: #000000; background: #ffffff; padding: 2px 8px; }
    .timer-red { color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .custom-alert-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6);
      z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease;
    }
    .custom-alert-box {
      background: var(--panel); border: 2px solid var(--accent); border-radius: 16px; padding: 25px;
      max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: var(--text);
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .toast {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--panel);
      border: 1px solid var(--accent); color: var(--text); padding: 12px 25px; border-radius: 30px;
      z-index: 99999; font-size: 0.95rem; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.4); pointer-events: none;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

    .floating-nav-btns {
      position: fixed; bottom: 25px; left: 25px; z-index: 900; display: flex; flex-direction: column; gap: 8px;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .floating-nav-btns.visible { opacity: 1; pointer-events: auto; }
    .float-btn {
      width: var(--fn-size, 45px); height: var(--fn-size, 45px); border-radius: 50%;
      background: var(--fn-bg, rgba(20,20,20,0.8)); color: var(--fn-color, #ffffff);
      border: 2px solid var(--fn-border, var(--accent)); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: var(--fn-arrow-size, 18px); font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s;
    }
    .float-btn:active { transform: scale(0.9); }
  </style>
</head>

  <main id="mainContainer">

  <style>
    .unit-box { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; overflow: hidden; background: var(--panel); width: 100%; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 25px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; color: var(--text); }
  </style>

  <script>
    const DB_NAME = 'LegendaryExamsOnlyDB_v2';
    let db = null;
    let unitsData = []; 

    let appSettings = {
      enableCreatorNav: false,
      navBgColor: 'rgba(20,20,20,0.8)',
      navTextColor: '#ffffff',
      navBorderColor: '#bb86fc',
      navSize: 45,
      navOpacity: 0.85,
      navArrowSize: 18,
      navTextSize: 18 // توافق مع النسخ القديمة
    };

    function loadAppSettings() {
      const saved = localStorage.getItem('legendary_app_settings');
      if (saved) {
        try { appSettings = JSON.parse(saved); } catch(e){}
      }
      applyAppSettingsToDOM();
    }

    function saveAppSettings() {
      try { localStorage.setItem('legendary_app_settings', JSON.stringify(appSettings)); }
      catch(e) { console.error(e); showToast('⚠️ تعذر حفظ الإعدادات محلياً'); return false; }
      applyAppSettingsToDOM();
      return true;
    }

    function applyAppSettingsToDOM() {
      const root = document.documentElement;
      root.style.setProperty('--fn-bg', appSettings.navBgColor);
      root.style.setProperty('--fn-color', appSettings.navTextColor);
      root.style.setProperty('--fn-border', appSettings.navBorderColor);
      root.style.setProperty('--fn-size', appSettings.navSize + 'px');
      root.style.setProperty('--fn-text-size', (appSettings.navTextSize || 18) + 'px');
      const fc = document.getElementById('floatingNavContainer');
      if (fc) fc.style.opacity = appSettings.navOpacity;
    }

    function showCustomAlert(title, message, callback) {
      const overlay = document.createElement('div');
      overlay.className = 'custom-alert-overlay';
      const box = document.createElement('div');
      box.className = 'custom-alert-box';
      const h3 = document.createElement('h3');
      h3.style.cssText = 'margin-bottom:10px;color:var(--accent)';
      h3.textContent = String(title ?? '');
      const p = document.createElement('p');
      p.style.cssText = 'margin-bottom:20px;line-height:1.5';
      p.textContent = String(message ?? '');
      const ok = document.createElement('button');
      ok.className = 'btn';
      ok.style.width = '100%';
      ok.textContent = '✓';
      box.append(h3,p,ok);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      ok.onclick = () => { overlay.remove(); if (callback) callback(); };
      ok.focus();
    }

    function showCustomConfirm(title, message, onYes, onNo) {
      const overlay = document.createElement('div');
      overlay.className = 'custom-alert-overlay';
      const box = document.createElement('div');
      box.className = 'custom-alert-box';
      const h3 = document.createElement('h3');
      h3.style.cssText = 'margin-bottom:10px;color:var(--accent)';
      h3.textContent = String(title ?? '');
      const p = document.createElement('p');
      p.style.cssText = 'margin-bottom:20px;line-height:1.5';
      p.textContent = String(message ?? '');
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px';
      const yes = document.createElement('button');
      yes.className = 'btn btn-success';
      yes.style.flex = '1';
      yes.textContent = '✓';
      const no = document.createElement('button');
      no.className = 'btn btn-danger';
      no.style.flex = '1';
      no.textContent = '✕';
      row.append(yes,no); box.append(h3,p,row); overlay.appendChild(box); document.body.appendChild(overlay);
      yes.onclick = () => { overlay.remove(); if(onYes) onYes(); };
      no.onclick = () => { overlay.remove(); if(onNo) onNo(); };
      yes.focus();
    }

    function showCustomPrompt(title, defaultValue, callback) {
      const overlay = document.createElement('div');
      overlay.className = 'custom-alert-overlay';
      const box = document.createElement('div');
      box.className = 'custom-alert-box';
      const h3 = document.createElement('h3');
      h3.style.cssText = 'margin-bottom:10px;color:var(--accent)';
      h3.textContent = String(title ?? '');
      const input = document.createElement('input');
      input.type = 'text';
      input.style.marginBottom = '20px';
      input.value = String(defaultValue ?? '');
      input.autocomplete = 'off';
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px';
      const ok = document.createElement('button');
      ok.className = 'btn btn-success';
      ok.style.flex = '1';
      ok.textContent = '✓';
      const cancel = document.createElement('button');
      cancel.className = 'btn btn-danger';
      cancel.style.flex = '1';
      cancel.textContent = '✕';
      row.append(ok,cancel); box.append(h3,input,row); overlay.appendChild(box); document.body.appendChild(overlay);
      input.focus();
      input.addEventListener('input', () => smartDetectLanguage(input));
      ok.onclick = () => { const val = input.value; overlay.remove(); if(callback) callback(val); };
      cancel.onclick = () => overlay.remove();
      input.addEventListener('keydown', e => { if(e.key === 'Enter') ok.click(); if(e.key === 'Escape') cancel.click(); });
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function smartDetectLanguage(el) {
      if (!el || !el.value) return;
      const text = el.value.trim();
      if (text.length === 0) return;
      const firstChar = text.charAt(0);
      const isEnglish = /[a-zA-Z]/.test(firstChar) || (/^[a-zA-Z\s\d\p{P}]/u.test(text.substring(0, 5)) && !/[\u0600-\u06FF]/.test(text.substring(0, 5)));
      
      if (isEnglish) {
        el.setAttribute('lang', 'en');
        el.setAttribute('dir', 'ltr');
        el.style.direction = 'ltr';
        el.style.textAlign = 'left';
      } else {
        el.setAttribute('lang', 'ar');
        el.setAttribute('dir', 'rtl');
        el.style.direction = 'rtl';
        el.style.textAlign = 'right';
      }
    }

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains('data')) db.createObjectStore('data', { keyPath: 'id' });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
      });
    }

    function saveData(key, val) {
      if (!db) return;
      const tx = db.transaction('data', 'readwrite');
      tx.objectStore('data').put({ id: key, content: val });
    }

    function loadData(key) {
      return new Promise((resolve) => {
        if (!db) return resolve(null);
        const tx = db.transaction('data', 'readonly');
        const req = tx.objectStore('data').get(key);
        req.onsuccess = () => resolve(req.result ? req.result.content : null);
      });
    }

    let currentTheme = 'dark-pure';
    function changeTheme(theme) {
      currentTheme = theme;
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('selected_exam_theme', theme);
      initBackgroundAnimation();
    }

    let animId = null;
    function initBackgroundAnimation() {
      if (animId) cancelAnimationFrame(animId);
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      if (currentTheme === 'light-floral') {
        let flowers = Array.from({length: 15}, () => ({
          x: Math.random()*w, y: Math.random()*h, r: 8+Math.random()*8,
          vy: 0.3 + Math.random()*0.5, vx: Math.sin(Math.random()*Math.PI)
        }));
        function drawFloral() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = 'rgba(244, 114, 182, 0.3)';
          flowers.forEach(f => {
            f.y += f.vy; f.x += Math.sin(f.y * 0.02) * 0.5;
            if (f.y > h) f.y = -10;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
          });
          animId = requestAnimationFrame(drawFloral);
        }
        drawFloral();
      } else if (currentTheme === 'sci-fi') {
        let stars = Array.from({length: 40}, () => ({
          x: Math.random()*w, y: Math.random()*h, s: Math.random()*2+1, speed: Math.random()*2+0.5
        }));
        function drawSciFi() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#38edf8';
          stars.forEach(s => {
            s.y += s.speed; if (s.y > h) s.y = 0;
            ctx.fillRect(s.x, s.y, s.s, s.s*2);
          });
          animId = requestAnimationFrame(drawSciFi);
        }
        drawSciFi();
      } else {
        ctx.clearRect(0, 0, w, h);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const rtlCount=(String(text).match(/[\u0600-\u06FF]/g)||[]).length,latinCount=(String(text).match(/[A-Za-z]/g)||[]).length;u.lang=latinCount>rtlCount?'en-US':'ar-SA';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } else {
        showToast('⚠️ القراءة الصوتية غير مدعومة في متصفحك');
      }
    }

    /* ================= إعدادات عامة مع الزر الدائري الجديد لرفع الفيديو وخانة حجم نص التنقل ================= */
    function openGeneralSettingsModal() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>⚙️ الإعدادات العامة للصفحة</h3>
          
          <div style="margin: 15px 0;">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">ملء الشاشة:</label>
            <button class="btn" style="width:100%;" onclick="toggleFullScreenMode()" title="ملء الشاشة">📺</button>
          </div>

          <hr style="border-color:var(--border); margin:15px 0;">

          <div style="margin: 15px 0; text-align: center;">
            <label style="font-weight:bold; display:block; margin-bottom:10px;">فيديو الخلفية (رفع مع الثيم):</label>
            <!-- مخفي للتحكم بالرفع -->
            <input type="file" id="bgVideoFileInput" accept="video/*" style="display:none;" onchange="handleVideoFileSelected(event)">
            
            <!-- الزر الدائري الجميل الجديد المطلوب -->
            <button onclick="document.getElementById('bgVideoFileInput').click()" style="width: 70px; height: 70px; border-radius: 50%; background: var(--accent); color: #fff; border: 2px solid var(--border); font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: inline-flex; align-items: center; justify-content: center; transition: transform 0.2s;" title="رفع فيديو خلفية">
              🎬
            </button>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px;">
              <button class="btn btn-secondary" style="flex:1;" onclick="toggleVideoAudio()" title="الصوت">🔊</button>
              <button class="btn btn-danger" style="flex:1;" onclick="removeBackgroundVideo()" title="حذف">🗑️</button>
            </div>
          </div>

          <hr style="border-color:var(--border); margin:15px 0;">

          <div style="margin: 15px 0;">
            <h4 style="color:var(--accent); margin-bottom:10px;">أزرار التنقل السريع العائمة</h4>
            <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer;">
              <input type="checkbox" id="set_creatorNav" ${appSettings.enableCreatorNav ? 'checked' : ''}> تفعيل أزرار التنقل في وضع الإنشاء
            </label>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
              <div>
                <label>لون الخلفية:</label>
                <input type="color" id="set_navBg" value="${rgbToHex(appSettings.navBgColor) || '#141414'}" style="height:40px; padding:2px;">
              </div>
              <div>
                <label>لون السهم:</label>
                <input type="color" id="set_navColor" value="${appSettings.navTextColor}" style="height:40px; padding:2px;">
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <label>لون الإطار:</label>
              <input type="color" id="set_navBorder" value="${appSettings.navBorderColor}" style="height:40px; padding:2px; width:100%;">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
              <div>
                <label>حجم الزر (px):</label>
                <input type="number" id="set_navSize" value="${appSettings.navSize}" min="30" max="80">
              </div>
              <div>
                <label>الشفافية:</label>
                <input type="number" id="set_navOpacity" value="${appSettings.navOpacity}" min="0.1" max="1" step="0.05">
              </div>
            </div>

            <!-- الخانة الجديدة من نوع input type="number" لتحديد حجم النص الخاص بزري التنقل السريع (px) -->
            <div style="margin-bottom:10px;">
              <label>حجم النص الخاص بزري التنقل (px):</label>
              <input type="number" id="set_navTextSize" value="${appSettings.navTextSize || 18}" min="10" max="40">
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-success" style="flex:1;" onclick="saveGeneralSettingsFromModal()" title="حفظ">💾</button>
            <button class="btn btn-danger" style="flex:1;" onclick="closeModal()" title="إغلاق">✕</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function toggleFullScreenMode() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          showCustomAlert("تنبيه", "هذه الميزة تعمل على المتصفح فقط.");
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }

    function rgbToHex(rgb) {
      if (rgb.startsWith('#')) return rgb;
      const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)$/);
      if (!match) return '#141414';
      function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
      return "#" + hex(match[1]) + hex(match[2]) + hex(match[3]);
    }

    function addNewUnit() {
      showCustomPrompt('أدخل اسم الوحدة/المادة الجديدة:', '', async (name) => {
        const clean = String(name ?? '').trim();
        if (!clean) return;
        if (clean.length > 120) return showToast('⚠️ اسم الوحدة طويل جداً (الحد 120 حرفاً)');

        const unit = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), title: clean, exams: [] };
        unitsData.push(unit);
        try { await saveData('units', unitsData); renderUnitsList(); }
        catch(e) { unitsData = unitsData.filter(u => u !== unit); console.error(e); showToast('⚠️ تعذر حفظ الوحدة'); }

    function addExamToUnit(unitId) {
      showCustomPrompt('أدخل اسم الاختبار الجديد:', '', async (title) => {
        const clean = String(title ?? '').trim();
        if (!clean) return;
        if (clean.length > 160) return showToast('⚠️ اسم الاختبار طويل جداً (الحد 160 حرفاً)');
        const unit = unitsData.find(u => u.id === unitId);
        if (!unit) return showToast('⚠️ الوحدة غير موجودة');
        if (typeof normalizeMergeText === 'function' && unit.exams.some(e => normalizeMergeText(e?.title) === normalizeMergeText(clean))) return showToast('⚠️ هذا الاختبار موجود بالفعل في الوحدة');
        const newExam = { id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), title: clean, questions: [] };
        unit.exams.push(newExam);
        try { await saveData('units', unitsData); renderUnitsList(); editExam(unitId, newExam.id); }
        catch(e) { unit.exams = unit.exams.filter(e => e !== newExam); console.error(e); showToast('⚠️ تعذر حفظ الاختبار'); }
      });
    }

          unitsData = unitsData.filter(u => u.id !== unitId);
          await saveData('units', unitsData);
          await window.garbageCollectMedia();
          renderUnitsList();
        } catch(e) { console.error(e); showToast('⚠️ تعذر حذف الوحدة'); }

    function deleteSelectedExams() {
      const selected = Array.from(document.querySelectorAll('.exam-checkbox:checked'));
      if (selected.length === 0) return showToast('⚠️ اختر اختبارات للحذف أولاً!');
      showCustomConfirm('تأكيد الحذف', `حذف ${selected.length} اختبار محدد؟`, async () => {
        try {
          selected.forEach(cb => {
            const uId = cb.dataset.unit, eId = cb.dataset.exam;
            const unit = unitsData.find(u => u.id === uId);
            if (unit) unit.exams = unit.exams.filter(e => e.id !== eId);
          });
          if (currentActiveExamData && selected.some(cb => cb.dataset.unit === currentActiveExamData.unitId && cb.dataset.exam === currentActiveExamData.examId)) window.endActiveExamSession();
          await saveData('units', unitsData);
          await window.garbageCollectMedia();
          renderUnitsList();
        } catch(e) { console.error(e); showToast('⚠️ تعذر حذف الاختبارات المحددة'); }
      });
    }

        try {
          window.endActiveExamSession();
          unitsData = [];
          await saveData('units', unitsData);

      return '';

        q.subParagraphs.forEach(p => addParagraphField(p));

      if (q && q.hints) {

      document.getElementById('m_hints_box').style.display = type !== 'paragraph' ? 'block' : 'none';
    }

    function addParagraphField(val) {
      const list = document.getElementById('m_paragraphs_list');

      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.gap = '8px';
      div.style.marginBottom = '8px';

        <input type="text" class="m_hint_val" placeholder="تلميح..." value="${val}" oninput="smartDetectLanguage(this)" style="margin-bottom:0; flex:1;">

    function buildOptionsInputs(count, existing = []) {
      const list = document.getElementById('m_opts_list');
      list.innerHTML = '';
      for (let i = 0; i < count; i++) {
        list.innerHTML += `<input type="text" class="m_opt_val" placeholder="خيار ${i+1}" value="${existing[i] || ''}" oninput="smartDetectLanguage(this)">`;
      }
    }

    function saveQuestionModal(unitId, examId, editIdx) {
      const unit = unitsData.find(u => u.id === unitId);
      const exam = unit.exams.find(e => e.id === examId);
      const type = document.getElementById('m_type').value;
      const text = document.getElementById('m_text').value.trim();
      if (!text) return showToast('⚠️ أدخل نص العنصر!');

      let newQ = { type, text };

      const subParas = Array.from(document.querySelectorAll('.m_para_val')).map(i => i.value.trim()).filter(Boolean);
      if (subParas.length > 0) newQ.subParagraphs = subParas;

      const hints = Array.from(document.querySelectorAll('.m_hint_val')).map(i => i.value.trim()).filter(Boolean);
      if (hints.length > 0) newQ.hints = hints;

      if (type === 'mcq') {
        const opts = Array.from(document.querySelectorAll('.m_opt_val')).map(i => i.value.trim());
        const correct = parseInt(document.getElementById('m_correct').value) - 1;
        newQ.options = opts; newQ.correct = correct;
      } else if (type === 'explain') {
        const kw = document.getElementById('m_keywords').value.split(/[,;\n]/).map(k => k.trim()).filter(Boolean);
        newQ.keywords = kw;
      }

      if (editIdx !== null) exam.questions[editIdx] = newQ;
      else exam.questions.push(newQ);

      saveData('units', unitsData);
      closeModal();
      renderQuestionsBuilder(unitId, examId);
    }

    function calculateExamTimeInSeconds(qCount) {
      let minutes = qCount * 2;
      return Math.floor(minutes * 60);
    }

    let timerInterval = null;
    let totalExamSeconds = 0;
    let remainingSeconds = 0;
    let currentActiveExamData = null;
    let scrollTimeout = null;

    function startExam(unitId, examId) {
      const unit = unitsData.find(u => u.id === unitId);
      const exam = unit.exams.find(e => e.id === examId);
      if (exam.questions.length === 0) return showToast('⚠️ لا توجد أسئلة!');

      currentActiveExamData = { unitId, examId, exam };
      const main = document.getElementById('mainContainer');
      totalExamSeconds = calculateExamTimeInSeconds(exam.questions.length);
      remainingSeconds = totalExamSeconds;

      showFloatingNav();

      main.innerHTML = `
        <div class="exam-timer-bar">
          <span>⏱️ الوقت:</span>
          <div id="timerDisplay" class="timer-badge timer-green">00:00</div>
          <button class="btn btn-secondary" style="padding:2px 10px;" onclick="speakAllQuestions()" title="قراءة">🔊</button>
        </div>

        <div class="card">
          <h2>📝 ${exam.title}</h2>
          <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
            <button class="btn btn-danger" onclick="restartExam('${unitId}', '${examId}')" title="إعادة">🔄</button>
            <button class="btn btn-secondary" onclick="renderMainUI()" title="خروج">⬅️</button>
          </div>
        </div>

        <form id="examForm"></form>

        <button class="btn btn-success" style="width:100%; padding:15px; margin-top:15px; font-size:1.1rem;" onclick="submitAndGradeExam()" title="إنهاء">📤</button>
        <div id="resultsContainer"></div>
      `;

      renderExamQuestionsForm(exam);
      startExamTimer();
      window.onscroll = handleExamScrolling;
    }

    function renderExamQuestionsForm(exam) {
      const form = document.getElementById('examForm');
      form.innerHTML = '';
      exam.questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question-card';
        div.id = `question_card_${i}`;
        
        let html = '';
        if (q.type === 'paragraph') {
          html += `<div style="font-size:1.05rem; line-height:1.6; font-weight:bold; margin-bottom:10px;">📖 فقرة ${i+1}: ${q.text}</div>`;
        } else {
          html += `<div><strong>س${i+1}:</strong> ${q.text} <button type="button" class="btn" style="padding:2px 6px; font-size:0.75rem;" onclick="speakText('${q.text}')" title="قراءة">🔊</button></div>`;
        }

        if (q.subParagraphs && q.subParagraphs.length > 0) {
          q.subParagraphs.forEach((p) => {
            html += `<div style="background:var(--input-bg); padding:10px; border-radius:8px; margin:8px 0; border:1px solid var(--border);">🔹 ${p}</div>`;
          });
        }

        if (q.type === 'mcq') {
          q.options.forEach((opt, oIdx) => {
            html += `<label class="opt-label"><input type="radio" name="ans_${i}" value="${oIdx}"> ${opt}</label>`;
          });
        } else if (q.type === 'explain') {
          html += `<textarea name="ans_${i}" placeholder="اكتب إجابتك هنا..." oninput="smartDetectLanguage(this)" style="margin-top:10px;"></textarea>`;
        }

        if (q.hints && q.hints.length > 0 && q.type !== 'paragraph') {
          html += `<button type="button" class="btn btn-secondary" style="margin-top:8px; padding:4px 10px; font-size:0.8rem;" onclick="showRandomHintForQuestion(${i})" title="تلميح">💡</button>`;
        }

        div.innerHTML = html;
        form.appendChild(div);
      });
    }

    function showRandomHintForQuestion(qIdx) {
      const exam = currentActiveExamData.exam;
      const q = exam.questions[qIdx];
      if (!q.hints || q.hints.length === 0) return;
      const randomHint = q.hints[Math.floor(Math.random() * q.hints.length)];
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.borderColor = 'var(--accent)';
      toast.textContent = `💡 تلميح: ${randomHint}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function scrollToQuestion(pos) {
      if (pos === 'top') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }

    let floatingNavMode = 'none';
    let floatingNavHideTimer = null;
    let floatingNavListenersBound = false;

    function navSvg(direction) {
      return direction === 'up'
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 11.5 12 6l5.5 5.5"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6.5 12.5 12 18l5.5-5.5"/></svg>';
    }

    function ensureFloatingNav() {
      if (floatingNavMode === 'none') return null;
      let fc = document.getElementById('floatingNavContainer');
      if (fc) return fc;
      fc = document.createElement('div');
      fc.id = 'floatingNavContainer';
      fc.className = 'floating-nav-btns floating-nav-dynamic';
      fc.innerHTML = `
        <button class="float-btn" id="floatBtnUp" type="button" onclick="scrollToQuestion('top')" title="إلى أول سؤال" aria-label="إلى أول سؤال">${navSvg('up')}</button>
        <button class="float-btn" id="floatBtnDown" type="button" onclick="scrollToQuestion('bottom')" title="إلى آخر سؤال" aria-label="إلى آخر سؤال">${navSvg('down')}</button>`;
      document.body.appendChild(fc);
      applyAppSettingsToDOM();
      return fc;
    }

    function hideFloatingNavVisual() {
      const fc = document.getElementById('floatingNavContainer');
      if (fc) fc.classList.remove('visible');
    }

    function showFloatingNavVisual() {
      if (floatingNavMode === 'none') return;
      const fc = ensureFloatingNav();
      if (!fc) return;
      fc.classList.add('visible');
      if (floatingNavHideTimer) clearTimeout(floatingNavHideTimer);
      floatingNavHideTimer = setTimeout(hideFloatingNavVisual, 1000);
    }

    function handleExamScrolling() {
      if (floatingNavMode === 'none') return;
      showFloatingNavVisual();
    }

    function bindFloatingNavListeners() {
      if (floatingNavListenersBound) return;
      floatingNavListenersBound = true;
      window.addEventListener('scroll', handleExamScrolling, {passive:true});
      window.addEventListener('wheel', handleExamScrolling, {passive:true});
      window.addEventListener('touchstart', handleExamScrolling, {passive:true});
      window.addEventListener('touchmove', handleExamScrolling, {passive:true});
      window.addEventListener('pointerdown', handleExamScrolling, {passive:true});
    }

    function setFloatingNavMode(mode) {
      floatingNavMode = mode === 'exam' || mode === 'editor' ? mode : 'none';
      bindFloatingNavListeners();
      if (floatingNavMode === 'none') {
        if (floatingNavHideTimer) clearTimeout(floatingNavHideTimer);
        const fc = document.getElementById('floatingNavContainer');
        if (fc) fc.remove();
        return;
      }
      ensureFloatingNav();
      hideFloatingNavVisual();
    }

    function showFloatingNav(mode='exam') { setFloatingNavMode(mode); }
    function hideFloatingNav() { setFloatingNavMode('none'); }
    function checkCreatorNavVisibility() { setFloatingNavMode('editor'); }

    function startExamTimer() {
      if (timerInterval) clearInterval(timerInterval);
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          showCustomAlert('انتهى الوقت', '🚨 انتهى الوقت!', () => {
            renderMainUI();
          });
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const disp = document.getElementById('timerDisplay');
      if (!disp) return;
      const m = Math.floor(remainingSeconds / 60);
      const s = remainingSeconds % 60;
      disp.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function speakAllQuestions() {
      if (!currentActiveExamData) return;
      let fullText = currentActiveExamData.exam.questions.map((q, i) => q.type==='paragraph' ? `فقرة ${i+1}: ${q.text}` : `سؤال ${i+1}: ${q.text}`).join('. ');
      speakText(fullText);
    }

    function restartExam(unitId, examId) {
      showCustomConfirm('إعادة', 'إعادة الاختبار؟', () => {
        startExam(unitId, examId);
      });
    }

    function submitAndGradeExam() {
      clearInterval(timerInterval);
      const exam = currentActiveExamData.exam;
      let score = 0;
      let gradedCount = 0;

      exam.questions.forEach((q, i) => {
        if (q.type === 'paragraph') return;
        gradedCount++;
        if (q.type === 'mcq') {
          const sel = document.querySelector(`input[name="ans_${i}"]:checked`);
          if (sel && parseInt(sel.value) === q.correct) score++;
        } else if (q.type === 'explain') {
          const val = document.querySelector(`textarea[name="ans_${i}"]`)?.value || '';
          if (q.keywords && q.keywords.some(kw => val.includes(kw))) score++;
        }
      });

      const percentage = gradedCount > 0 ? Math.round((score / gradedCount) * 100) : 100;

      document.getElementById('resultsContainer').innerHTML = `
        <div class="card" style="text-align:center; margin-top:20px; border:2px solid var(--accent);">
          <h2>📊 النتيجة النهائية: ${percentage}%</h2>
          <p>الإجابات الصحيحة: ${score} من ${gradedCount}</p>
        </div>
      `;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function openRandomExamModal() {
      let examsListHTML = '';
      unitsData.forEach(u => {
        examsListHTML += `<div style="font-weight:bold; margin-top:8px; color:var(--accent);">📁 وحدة: ${u.title}</div>`;
        u.exams.forEach(e => {
          examsListHTML += `<label style="display:block; margin-right:15px; cursor:pointer;"><input type="checkbox" class="rand_exam_cb" data-unit="${u.id}" data-exam="${e.id}"> اختبار: ${e.title}</label>`;
        });
      });

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>🎯 اختبار عشوائي</h3>
          
          <div style="max-height:200px; overflow-y:auto; border:1px solid var(--border); padding:10px; border-radius:8px; background:var(--input-bg); margin-bottom:12px;">
            ${unitsData.map(u => `<label style="display:block; margin-right:10px; cursor:pointer;"><input type="checkbox" class="rand_unit_cb" value="${u.id}"> 📚 وحدة: ${u.title}</label>`).join('')}
            <hr style="border-color:var(--border); margin:10px 0;">
            ${examsListHTML}
          </div>

          <label>أقصى عدد للأسئلة:</label>
          <input type="number" id="r_count" value="15" min="1" max="500">

          <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-success" style="flex:1;" onclick="generateAdvancedRandomExam()" title="بدء">✓</button>
            <button class="btn btn-danger" style="flex:1;" onclick="closeModal()" title="إلغاء">✕</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function generateAdvancedRandomExam() {
      const selectedUnits = Array.from(document.querySelectorAll('.rand_unit_cb:checked')).map(cb => cb.value);
      const selectedExams = Array.from(document.querySelectorAll('.rand_exam_cb:checked')).map(cb => ({ uId: cb.dataset.unit, eId: cb.dataset.exam }));
      const count = parseInt(document.getElementById('r_count').value) || 10;

      let pool = [];
      unitsData.filter(u => selectedUnits.includes(u.id)).forEach(u => {
        u.exams.forEach(e => pool.push(...e.questions));
      });

      selectedExams.forEach(item => {
        const u = unitsData.find(unit => unit.id === item.uId);
        if (u) {
          const e = u.exams.find(exam => exam.id === item.eId);
          if (e) pool.push(...e.questions);
        }
      });

      if (pool.length === 0) {
        unitsData.forEach(u => u.exams.forEach(e => pool.push(...e.questions)));
      }

      if (pool.length === 0) return showToast('⚠️ لا توجد أسئلة!');

      const randQ = pool.sort(() => Math.random() - 0.5).slice(0, count);
      const tempUnit = { id: 'temp_rand', title: 'وحدة عشوائية', exams: [] };
      const tempExam = { id: 'rand_exam_sub', title: 'اختبار عشوائي', questions: randQ };
      
      unitsData.push(tempUnit);
      tempUnit.exams.push(tempExam);
      closeModal();
      startExam('temp_rand', 'rand_exam_sub');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadAppSettings();
      const savedTheme = localStorage.getItem('selected_exam_theme') || 'dark-pure';
      changeTheme(savedTheme);

      if (window.restoreBackgroundVideo) await window.restoreBackgroundVideo();
      const loadedUnits = await loadData('units');
      if (loadedUnits) unitsData = loadedUnits;

      renderMainUI();
    });
  </script>

  window.startExam=function(unitId,examId){const unit=unitsData.find(u=>u.id===unitId),exam=unit?.exams.find(e=>e.id===examId);if(!exam)return showToast('⚠️ تعذر العثور على الاختبار');if(!Array.isArray(exam.questions)||exam.questions.length===0)return showToast('⚠️ لا توجد أسئلة في هذا الاختبار');endActiveExamSession();currentActiveExamData={unitId,examId,exam};activeExamStartedAt=Date.now();activeExamEndAt=activeExamStartedAt+calculateExamTimeInSeconds(exam.questions.length)*1000;activeExamSubmitted=false;activeExamSubmitting=false;totalExamSeconds=calculateExamTimeInSeconds(exam.questions.length);remainingSeconds=totalExamSeconds;showFloatingNav();const main=document.getElementById('mainContainer');main.innerHTML=`<div class="exam-timer-bar"><span>⏱️ الوقت:</span><div id="timerDisplay" class="timer-badge timer-green">00:00</div><button class="btn btn-secondary" style="padding:2px 10px" onclick="speakAllQuestions()" title="قراءة">🔊</button></div><div class="card"><h2 dir="auto">📝 ${escapeHTML(exam.title)}</h2><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-danger" onclick="restartExam('${unitId}','${examId}')" title="${t('restart')}">🔄</button><button class="btn btn-secondary" onclick="renderMainUI()" title="${t('exit')}">⬅️</button></div></div><form id="examForm"></form><button id="submitExamBtn" class="btn btn-success" style="width:100%;padding:15px;margin-top:15px;font-size:1.1rem" type="button" onclick="submitAndGradeExam()" title="${t('submit')}">📤</button><div id="resultsContainer"></div>`;renderExamQuestionsForm(exam);startExamTimer();showFloatingNav()}
